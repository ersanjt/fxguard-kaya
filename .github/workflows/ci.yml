# Lint + tests (backend uses SQLite in-memory — no external DB)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:all
      # اگر chunkها عوض شده باشند و dashboard.js / dashboard.html دوباره باندل نشده باشد، CI قرمز می‌شود.
      - name: Verify dashboard bundle matches chunks
        run: npm run build:dashboard && git diff --exit-code public/js/dashboard.js public/dashboard.html

  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Ensure Gradle wrapper
        working-directory: android-app
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew
      - name: Assemble debug
        working-directory: android-app
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Lint debug
        working-directory: android-app
        run: ./gradlew :app:lintDebug --no-daemon
      - name: Stage Android APK for deploy
        run: |
          mkdir -p artifacts/kaya-staff-android
          cp android-app/app/build/outputs/apk/debug/app-debug.apk artifacts/kaya-staff-android/kaya-staff.apk
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("android-app/app/build.gradle.kts", "utf8");
            const code = Number((src.match(/versionCode\s*=\s*(\d+)/) || [])[1] || 0);
            const name = String((src.match(/versionName\s*=\s*"([^"]+)"/) || [])[1] || "");
            if (!code || !name) { console.error("could not parse version from build.gradle.kts"); process.exit(1); }
            fs.writeFileSync("artifacts/kaya-staff-android/android-version.json", JSON.stringify({ versionCode: code, versionName: name }, null, 2) + "\n");
            console.log("android version", code, name);
          '
      - uses: actions/upload-artifact@v4
        with:
          name: kaya-staff-android-apk
          path: artifacts/kaya-staff-android/
          if-no-files-found: error
          retention-days: 14

name: Deploy to VPS

# با هر push به master، سرور به‌صورت خودکار به‌روزرسانی می‌شود
on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST || '92.205.58.83' }}
          username: ${{ secrets.DEPLOY_USER || 'fxguard' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/var/www/kayaCRM' }}
            bash scripts/deploy.sh

name: Deploy to Server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # اگر خطای dial tcp ... i/o timeout دیدید: سرور از شبکهٔ GitHub در دسترس نیست (فایروال/پورت ۲۲). دیپلوی دستی را ببینید: docs/DEPLOY-SERVER.md
      # host/user ثابت — اگر خواستی از Secrets استفاده کنی: docs/DEPLOY-GITHUB-SECRETS.md
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 92.205.58.83
          username: fxguard
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e

            cd /var/www/kayaCRM

            # ---- بررسی متغیرهای الزامی در .env قبل از هر کاری ----
            echo "🔍 بررسی متغیرهای .env ..."
            ENV_FILE="backend/.env"
            check_env() {
              VAR=$1
              if ! grep -q "^${VAR}=" "$ENV_FILE" 2>/dev/null; then
                echo "❌ خطا: متغیر ${VAR} در ${ENV_FILE} تنظیم نشده است"
                exit 1
              fi
              VAL=$(grep "^${VAR}=" "$ENV_FILE" | cut -d= -f2-)
              if [ -z "$VAL" ]; then
                echo "❌ خطا: متغیر ${VAR} در ${ENV_FILE} خالی است"
                exit 1
              fi
              echo "  ✅ ${VAR} تنظیم شده"
            }
            check_env "JWT_SECRET"
            check_env "ENCRYPT_SECRET"
            check_env "MAIN_ADMIN_EMAIL"
            check_env "MAIN_ADMIN_PASSWORD"
            check_env "WEBHOOK_SECRET"

            # بررسی طول JWT_SECRET (حداقل ۳۲ کاراکتر)
            JWT_LEN=$(grep "^JWT_SECRET=" "$ENV_FILE" | cut -d= -f2- | wc -c)
            if [ "$JWT_LEN" -lt 33 ]; then
              echo "❌ خطا: JWT_SECRET باید حداقل ۳۲ کاراکتر باشد"
              exit 1
            fi
            echo "  ✅ JWT_SECRET طول کافی دارد"

            # بررسی طول ENCRYPT_SECRET (حداقل ۳۲ کاراکتر)
            ENC_LEN=$(grep "^ENCRYPT_SECRET=" "$ENV_FILE" | cut -d= -f2- | wc -c)
            if [ "$ENC_LEN" -lt 33 ]; then
              echo "❌ خطا: ENCRYPT_SECRET باید حداقل ۳۲ کاراکتر باشد"
              echo "   برای تولید: openssl rand -hex 32"
              exit 1
            fi
            # بررسی اینکه ENCRYPT_SECRET با JWT_SECRET یکسان نباشد
            JWT_VAL=$(grep "^JWT_SECRET=" "$ENV_FILE" | cut -d= -f2-)
            ENC_VAL=$(grep "^ENCRYPT_SECRET=" "$ENV_FILE" | cut -d= -f2-)
            if [ "$JWT_VAL" = "$ENC_VAL" ]; then
              echo "❌ خطا: ENCRYPT_SECRET نباید با JWT_SECRET یکسان باشد"
              exit 1
            fi
            echo "  ✅ ENCRYPT_SECRET طول کافی دارد و با JWT_SECRET متفاوت است"

            # ---- بکاپ دیتابیس ----
            echo "💾 بکاپ دیتابیس ..."
            cd backend
            node scripts/backup-database.js || true
            cd ..

            # ---- دریافت کد جدید ----
            echo "📥 دریافت کد جدید از git ..."
            git fetch origin
            git reset --hard origin/master

            # ---- نصب dependencies ----
            echo "📦 نصب dependencies ..."
            cd backend
            # پاک کردن node_modules برای جلوگیری از مشکلات stale cache
            rm -rf node_modules
            npm install --omit=dev
            echo "  ✅ npm install موفق"

            # ---- اجرای migration scripts ----
            echo "🗄️ اجرای migration scripts ..."
            node scripts/add-unanswered-columns.js
            node scripts/add-auto-messages-columns.js
            node scripts/add-activitylog-customerid.js
            node scripts/add-last-message-preview.js
            node scripts/add-ticket-number.js
            node scripts/add-transaction-customerid.js
            node scripts/add-ai-columns.js
            node scripts/add-conversation-indexes.js
            node scripts/add-customer-profile-fields.js
            echo "  ✅ migration scripts اجرا شد"

            # ---- بررسی syntax فایل‌های اصلی ----
            echo "🔎 بررسی syntax ..."
            node --check server.js
            node --check middleware/auth.js
            node --check middleware/socketAuth.js
            node --check lib/encrypt.js
            node --check routes/upload.js
            node --check routes/api.js
            node --check routes/panelSettings.js
            echo "  ✅ syntax بدون خطا"

            # ---- reload با PM2 ----
            echo "🔄 reload سرویس‌ها ..."
            cd ..
            # سعی می‌کنیم با ecosystem reload کنیم؛ اگر نشد stop/start می‌کنیم
            if pm2 reload ecosystem.config.js --update-env; then
              echo "  ✅ pm2 reload موفق"
            else
              echo "  ⚠️ reload شکست خورد، stop/start می‌کنیم..."
              pm2 stop ecosystem.config.js 2>/dev/null || true
              sleep 3
              pm2 start ecosystem.config.js --update-env
            fi
            pm2 save

            # ---- بررسی سلامت بعد از deploy (چند تلاش — گاهی PM2/Node کمی دیر گوش می‌دهد) ----
            echo "⏳ بررسی /api/ping روی پورت ۳۰۰۲ ..."
            OK=0
            for i in 1 2 3 4 5 6 7 8; do
              if curl -sf --max-time 10 http://localhost:3002/api/ping > /dev/null; then
                OK=1
                break
              fi
              echo "   تلاش $i از ۸ — هنوز پاسخی نیست، ۱۰ ثانیه بعد دوباره ..."
              sleep 10
            done
            if [ "$OK" = "1" ]; then
              echo "✅ Deploy موفق — سرور پاسخ می‌دهد"
            else
              echo "❌ هشدار: سرور پس از deploy پاسخ نمی‌دهد — لاگ‌ها را بررسی کنید"
              pm2 logs crm-backend --lines 40 --nostream || true
              pm2 logs crm-gateway --lines 20 --nostream || true
              pm2 logs kayaCRM --lines 30 --nostream || true
              exit 1
            fi

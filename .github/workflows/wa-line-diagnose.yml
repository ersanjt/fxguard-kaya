name: Diagnose WhatsApp line 0880

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Inspect Kaya WhatsApp cloud config for +905339470880
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 92.205.58.83
          username: fxguard
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 2m
          command_timeout: 8m
          script: |
            set +e
            cd /var/www/kayaCRM-kaya/backend
            echo "== host =="; hostname; date -u
            echo "== pm2 =="; pm2 describe crm-backend-kaya | grep -E 'status|uptime|pid|script path|exec cwd' | head -n 20
            echo "== env cloud keys (redacted) =="
            grep -E '^(WHATSAPP_CLOUD_|WHATSAPP_PHONE|META_|FRONTEND_URL|PORT)=' .env 2>/dev/null | sed -E 's/(TOKEN|SECRET|PASS|KEY)=.*/\1=<redacted>/I' || true
            echo "== DB whatsapp_connections (no secrets) =="
            node -e "
              require('dotenv').config();
              const { WhatsappConnection, WhatsappNumber, sequelize } = require('./models');
              (async () => {
                const rows = await WhatsappConnection.findAll({ raw: true, skipTenantScope: true });
                for (const r of rows) {
                  console.log(JSON.stringify({
                    id: r.id,
                    tenantId: r.tenantId || null,
                    mode: r.connectionMode,
                    cloudEnabled: r.cloudEnabled,
                    gatewayEnabled: r.gatewayEnabled,
                    phoneNumberId: r.cloudPhoneNumberId || null,
                    wabaId: r.cloudWabaId || null,
                    hasToken: !!(r.cloudAccessToken && String(r.cloudAccessToken).length > 8),
                    tokenLen: r.cloudAccessToken ? String(r.cloudAccessToken).length : 0,
                    embeddedAt: r.embeddedSignupAt || null,
                    updatedAt: r.updatedAt
                  }));
                }
                if (WhatsappNumber) {
                  const nums = await WhatsappNumber.findAll({
                    attributes: ['id','slotKey','label','displayPhone','cloudPhoneNumberId','enabled','tenantId'],
                    raw: true,
                    skipTenantScope: true
                  });
                  console.log('numbers', JSON.stringify(nums));
                }
                await sequelize.close();
              })().catch(e => { console.error(e.message); process.exit(1); });
            "
            echo "== Graph probe (prefer + fallback phone ids) =="
            node -e "
              require('dotenv').config();
              const axios = require('axios');
              const { WhatsappConnection, sequelize } = require('./models');
              (async () => {
                const row = await WhatsappConnection.findByPk('default', { skipTenantScope: true });
                const token = (row && row.cloudAccessToken) || process.env.WHATSAPP_CLOUD_ACCESS_TOKEN || '';
                const ver = process.env.WHATSAPP_CLOUD_GRAPH_API_VERSION || 'v26.0';
                const ids = [
                  row && row.cloudPhoneNumberId,
                  '1402168889654134',
                  '1007665702430638',
                  '1382387304965587'
                ].filter(Boolean);
                const seen = new Set();
                for (const id of ids) {
                  if (seen.has(id)) continue;
                  seen.add(id);
                  if (!token) { console.log(JSON.stringify({ id, error: 'no_token' })); continue; }
                  const r = await axios.get(
                    'https://graph.facebook.com/' + ver + '/' + id +
                      '?fields=id,display_phone_number,verified_name,quality_rating,account_mode,is_on_biz_app',
                    { headers: { Authorization: 'Bearer ' + token }, timeout: 15000, validateStatus: () => true }
                  );
                  console.log(JSON.stringify({ id, status: r.status, data: r.data }));
                }
                console.log(JSON.stringify({
                  hasAppSecret: !!(process.env.WHATSAPP_CLOUD_APP_SECRET || process.env.META_APP_SECRET),
                  verifyTokenSet: !!process.env.WHATSAPP_CLOUD_VERIFY_TOKEN,
                  boundPhoneId: row && row.cloudPhoneNumberId,
                  boundWaba: row && row.cloudWabaId
                }));
                await sequelize.close();
              })().catch(e => { console.error('VERIFY_ERR', e.message); process.exit(1); });
            "
            echo "== recent cloud/coexistence logs =="
            pm2 logs crm-backend-kaya --nostream --lines 120 2>/dev/null | grep -iE 'cloud|coexist|meta|graph|0880|1382387304965587|token|webhook' | tail -n 40
            echo "== done =="

version: '3.8'

services:
  # ==================== Databases ====================
  
  postgres:
    image: postgres:14-alpine
    container_name: whatsapp-crm-postgres
    environment:
      POSTGRES_DB: whatsapp_crm
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-StrongPassword123!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:5
    container_name: whatsapp-crm-mongo
    environment:
      MONGO_INITDB_DATABASE: whatsapp_crm
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - crm-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/whatsapp_crm --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: whatsapp-crm-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-RedisPassword123!}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.11-management-alpine
    container_name: whatsapp-crm-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-RabbitMQ123!}
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - crm-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Application Services ====================

  whatsapp-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: whatsapp-crm-gateway
    environment:
      NODE_ENV: production
      PORT: 3001
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-RabbitMQ123!}@rabbitmq:5672
      REDIS_URL: redis://:${REDIS_PASSWORD:-RedisPassword123!}@redis:6379
      BACKEND_API_URL: http://backend:3002
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
    volumes:
      - ./gateway/sessions:/app/sessions
      - ./gateway/uploads:/app/uploads
      - ./gateway/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - crm-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsapp-crm-backend
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: whatsapp_crm
      DB_USER: crm_user
      DB_PASSWORD: ${DB_PASSWORD:-StrongPassword123!}
      MONGODB_URL: mongodb://mongodb:27017/whatsapp_crm
      REDIS_URL: redis://:${REDIS_PASSWORD:-RedisPassword123!}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-RabbitMQ123!}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-YourSuperSecretJWTKey123456789!}
      FRONTEND_URL: http://localhost:3000
      GATEWAY_URL: http://whatsapp-gateway:3001
    ports:
      - "3002:3002"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - crm-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: whatsapp-crm-frontend
    environment:
      REACT_APP_API_URL: http://localhost:3002
      REACT_APP_GATEWAY_URL: http://localhost:3001
      REACT_APP_WS_URL: ws://localhost:3002
    ports:
      - "3000:80"
    depends_on:
      - backend
      - whatsapp-gateway
    networks:
      - crm-network
    restart: unless-stopped

  # ==================== Monitoring (Optional) ====================

  nginx:
    image: nginx:alpine
    container_name: whatsapp-crm-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
      - whatsapp-gateway
    networks:
      - crm-network
    restart: unless-stopped

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: whatsapp-crm-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - crm-network
    restart: unless-stopped

  # Grafana (Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: whatsapp-crm-grafana
    ports:
      - "3003:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - crm-network
    restart: unless-stopped

networks:
  crm-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
